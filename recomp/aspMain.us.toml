# RSPRecomp configuration for Body Harvest's audio microcode.
#
# The text at ROM 0x2FF10 is byte-identical, over 0xE20 bytes, to the aspMain
# Pilotwings 64 and Wave Race 64 recompile (SHA-1 21e05bb9...), and the 16-entry
# command table at ucode_data + 0x10 (ROM 0x3FC70) holds the same values. The
# bytes after 0xE20 are the next microcode: a 0xF80 extent (the declared task
# size) walks into it (playbook 06, "wrong text_size"). docs/findings/phase-02.md.

rom_file_path = "../rom.z64"
text_offset = 0x2FF10
text_size = 0xE20
# rspboot occupies IMEM 0x1000-0x107F and jumps to 0x1080 (playbook 06).
text_address = 0x04001080

output_file_path = "../RecompiledFuncs/aspMain_rsp.cpp"
output_function_name = "aspMain_run"

# The command handlers, read from ROM 0x3FC70; every value lies inside
# 0x1080..0x1EA0, so they are code addresses.
extra_indirect_branch_targets = [
    0x1118, 0x1470, 0x11DC, 0x1B38,
    0x1214, 0x187C, 0x1254, 0x12D0,
    0x12EC, 0x1328, 0x140C, 0x1294,
    0x1E24, 0x138C, 0x170C, 0x144C,
]
